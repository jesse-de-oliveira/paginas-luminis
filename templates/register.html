{% extends "base.html" %}
{% block content %}

  <div class="auth-wrapper">

    <div class="auth-box">
      <h2>Registrar</h2>
      <p class="latin">Comece sua jornada leitora.</p>

      <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" name="username" id="username" placeholder="Escolha um usuário" required>
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" name="senha" id="senha" placeholder="Crie uma senha" required>
        </div>
        <button type="submit" class="btn btn-green">Criar conta</button>
      </form>

      <div class="auth-footer">
        Já tem conta? <a href="{{ url_for('login') }}">Entrar.</a>
      </div>
    </div>

  </div>

{% endblock %}
